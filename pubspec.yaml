name: kairos
description: "Кайрос – календар за свещеници."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.3.0
  supabase_flutter: ^2.18.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  image_picker: ^1.1.2
  alarm: ^5.15.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  flutter_local_notifications: ^23.0.1
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo-kairos.png
    - assets/whats_new.json
    - assets/alarm.mp3
