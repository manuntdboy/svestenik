name: Изграждане на APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Създаване на Android частта
        run: |
          flutter --version
          flutter create . --platforms=android --org bg.svestenik --project-name svestenik
          rm -f test/widget_test.dart   # примерен тест от шаблона, не ни трябва
          # Име на приложението, известия, настройки за изграждане
          python3 ci/patch_android.py .
          cat android/settings.gradle.kts

      - name: Постоянен тестов ключ (за да се обновява върху старата версия)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: Проверка на кода
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Изграждане
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Преименуване
        run: cp build/app/outputs/flutter-apk/app-release.apk svestenik-${{ github.run_number }}.apk

      - name: Публикуване за сваляне от телефона
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Тестова версия ${{ github.run_number }}
          body: Свалете файла .apk на телефона и го отворете, за да се инсталира.
          prerelease: true
          files: svestenik-${{ github.run_number }}.apk
