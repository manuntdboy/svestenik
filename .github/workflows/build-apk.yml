name: Изграждане на APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dbtest:
    name: Тест на базата
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Всички миграции и правила за достъп
        run: ci/run_db_tests.sh

  server:
    name: Сървър (Supabase)
    needs: dbtest
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Свързване с проекта
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Адрес на базата през IPv4 (pooler)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # GitHub няма IPv6, затова ползваме пула за връзки на Supabase (IPv4).
          # Ако е зададен секрет SUPABASE_DB_URL, той има предимство.
          if [ -n "$SUPABASE_DB_URL" ]; then
            url="$SUPABASE_DB_URL"
          else
            pw=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
            url=""
            for host in aws-1-eu-central-1.pooler.supabase.com aws-0-eu-central-1.pooler.supabase.com; do
              try="postgresql://postgres.${SUPABASE_PROJECT_REF}:${pw}@${host}:5432/postgres?sslmode=require"
              if psql "$try" -tAc 'select 1' >/dev/null 2>&1; then
                url="$try"; echo "Връзка през $host"; break
              fi
            done
          fi
          if [ -z "$url" ]; then
            echo "::error::Няма връзка с базата през pooler. Проверете SUPABASE_DB_PASSWORD или добавете секрет SUPABASE_DB_URL (Connect → Session pooler)."
            exit 1
          fi
          echo "::add-mask::$url"
          echo "DB_URL=$url" >> "$GITHUB_ENV"

      # Резервно копие точно преди промяна в базата (само ако има нови миграции).
      - name: Резервно копие преди промяната на базата
        id: prebackup
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          local_n=$(ls supabase/migrations/*.sql | wc -l)
          remote_n=$(psql "$DB_URL" -tAc "select count(*) from supabase_migrations.schema_migrations" 2>/dev/null || echo 0)
          echo "Миграции: тук $local_n, на сървъра $remote_n"
          if [ "$local_n" -le "$remote_n" ]; then echo "Няма промени в базата – копие не е нужно."; exit 0; fi
          if [ -z "$BACKUP_PASSWORD" ]; then echo "::warning::Няма BACKUP_PASSWORD – без копие преди промяната."; exit 0; fi
          v=$(psql "$DB_URL" -tAc 'show server_version_num' | cut -c1-2)
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq "postgresql-client-$v" >/dev/null
          "/usr/lib/postgresql/$v/bin/pg_dump" "$DB_URL" --format=custom --no-owner --no-privileges \
            -n public -n auth -n storage -f predi.dump
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase-fd 0 -o predi.dump.gpg predi.dump <<< "$BACKUP_PASSWORD"
          rm -f predi.dump
          ls -lh predi.dump.gpg
          echo "made=true" >> "$GITHUB_OUTPUT"

      - name: Запазване на копието (30 дни)
        if: steps.prebackup.outputs.made == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kairos-predi-promyana-${{ github.run_number }}
          path: predi.dump.gpg
          retention-days: 30

      - name: Прилагане на промените по базата
        run: supabase db push --remote="$DB_URL" --yes

      - name: Създателят (за „Кайрос в числа“)
        env:
          AUTHOR_EMAIL: ${{ secrets.AUTHOR_EMAIL }}
        run: |
          # Имейлът е само в секрета; в базата се пази само id на профила.
          if [ -z "$AUTHOR_EMAIL" ]; then echo "::notice::Няма AUTHOR_EMAIL – пропускам."; exit 0; fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -t -v email="$AUTHOR_EMAIL" <<'SQL'
          insert into public.app_creators (user_id)
          select id from auth.users where lower(email) = lower(:'email')
          on conflict do nothing;
          select 'създатели: ' || count(*) from public.app_creators;
          SQL

      - name: Качване на сървърните функции (login, notify)
        run: supabase functions deploy --remote="$SUPABASE_PROJECT_REF" --no-verify-jwt --yes

      - name: Проверка на живия сървър (без промени)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: ci/smoke_live.sh

  build:
    needs: server
    runs-on: ubuntu-latest
    env:
      # Firebase се включва само когато тайните са добавени в GitHub Secrets.
      HAS_FIREBASE: ${{ secrets.FIREBASE_APP_ID != '' && secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      # Към тестерите се изпраща само при ръчно пускане (Actions → Run workflow)
      # или когато съобщението на промяната съдържа „[тестери]“.
      SEND_TO_TESTERS: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[тестери]') }}
      # „[аз]“ в съобщението – версията отива само до автора (имейлът е в секрета AUTHOR_EMAIL).
      SEND_TO_ME: ${{ contains(github.event.head_commit.message, '[аз]') }}
      APK_NAME: kairos-${{ github.run_number }}.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Заключено до след теста в реална среда (21.11) – без изненади от нов Flutter.
          flutter-version: 3.50.0
          cache: true

      - name: Създаване на Android частта
        run: |
          flutter --version
          flutter create . --platforms=android --org bg.kairos --project-name kairos
          rm -f test/widget_test.dart   # примерен тест от шаблона, не ни трябва
          # Име на приложението, пакет, известия, настройки за изграждане
          python3 ci/patch_android.py .
          cat android/settings.gradle.kts

      - name: Постоянен тестов ключ (за да се обновява върху старата версия)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: Проверка на кода
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Тестове на логиката
        run: flutter test

      - name: Изграждане
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_ANDROID_API_KEY="$FIREBASE_ANDROID_API_KEY" \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=TEST_BUILD=true

      - name: Преименуване
        run: cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"

      - name: Публикуване в GitHub Releases (резервно)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Тестова версия ${{ github.run_number }}
          body: Свалете файла .apk на телефона и го отворете, за да се инсталира.
          # Версията за всички тестери е „latest“ – по нея приложението предлага „Обнови“.
          prerelease: ${{ env.SEND_TO_TESTERS != 'true' }}
          make_latest: ${{ env.SEND_TO_TESTERS == 'true' }}
          files: ${{ env.APK_NAME }}

      - name: Изпращане към Firebase App Distribution
        if: env.HAS_FIREBASE == 'true' && env.SEND_TO_TESTERS == 'true'
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          # Бележките са същите като в камбанката на приложението.
          python3 ci/release_notes.py "${{ github.run_number }}" > "$RUNNER_TEMP/notes.txt"
          cat "$RUNNER_TEMP/notes.txt"
          npx --yes firebase-tools@latest appdistribution:distribute "$APK_NAME" \
            --app "$FIREBASE_APP_ID" \
            --groups "testers" \
            --release-notes-file "$RUNNER_TEMP/notes.txt"
          rm -f "$RUNNER_TEMP/firebase-sa.json"

      - name: Изпращане само до автора
        if: env.HAS_FIREBASE == 'true' && env.SEND_TO_TESTERS != 'true' && env.SEND_TO_ME == 'true'
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          AUTHOR_EMAIL: ${{ secrets.AUTHOR_EMAIL }}
        run: |
          if [ -z "$AUTHOR_EMAIL" ]; then
            echo "::error::Липсва секрет AUTHOR_EMAIL (GitHub → Settings → Secrets and variables → Actions)."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          # Авторът е създателят – в бележките са и „само за вас“.
          python3 ci/release_notes.py "${{ github.run_number }}" --creator > "$RUNNER_TEMP/notes.txt"
          npx --yes firebase-tools@latest appdistribution:distribute "$APK_NAME" \
            --app "$FIREBASE_APP_ID" \
            --testers "$AUTHOR_EMAIL" \
            --release-notes-file "$RUNNER_TEMP/notes.txt"
          rm -f "$RUNNER_TEMP/firebase-sa.json"

      - name: Без изпращане към тестерите
        if: env.HAS_FIREBASE == 'true' && env.SEND_TO_TESTERS != 'true' && env.SEND_TO_ME != 'true'
        run: echo "::notice::Версията е изградена, но не е изпратена към тестерите (няма „[тестери]“ в съобщението)."

      - name: Напомняне за Firebase
        if: env.HAS_FIREBASE != 'true'
        run: echo "::notice::Firebase App Distribution не е настроен (липсват FIREBASE_APP_ID и FIREBASE_SERVICE_ACCOUNT). APK е само в GitHub Releases."

  # Уеб версия (браузър на компютър) – качва се в GitHub Pages
  # при версия за всички („[тестери]“), при „[уеб]“ или при ръчно пускане.
  web:
    needs: server
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[тестери]') || contains(github.event.head_commit.message, '[уеб]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Заключено до след теста в реална среда (21.11) – без изненади от нов Flutter.
          flutter-version: 3.50.0
          cache: true
      - name: Създаване на уеб частта
        run: |
          flutter create . --platforms=web --org bg.kairos --project-name kairos
          rm -f test/widget_test.dart
          sed -i 's#<title>[^<]*</title>#<title>Кайрос</title>#' web/index.html
          python3 - <<'PY'
          import json
          p = 'web/manifest.json'
          m = json.load(open(p))
          m.update(name='Кайрос', short_name='Кайрос', description='Кайрос – приложение за свещеници',
                   background_color='#12161C', theme_color='#12161C')
          json.dump(m, open(p, 'w'), ensure_ascii=False, indent=2)
          PY
      - run: flutter pub get
      - name: Изграждане за браузър
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build web --release --base-href /svestenik/ \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=TEST_BUILD=true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4
