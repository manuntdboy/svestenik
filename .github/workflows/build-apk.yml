name: Изграждане на APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dbtest:
    name: Тест на базата
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Всички миграции и правила за достъп
        run: ci/run_db_tests.sh

  server:
    name: Сървър (Supabase)
    needs: dbtest
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Свързване с проекта
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Адрес на базата през IPv4 (pooler)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # GitHub няма IPv6, затова ползваме пула за връзки на Supabase (IPv4).
          # Ако е зададен секрет SUPABASE_DB_URL, той има предимство.
          if [ -n "$SUPABASE_DB_URL" ]; then
            url="$SUPABASE_DB_URL"
          else
            pw=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
            url=""
            for host in aws-1-eu-central-1.pooler.supabase.com aws-0-eu-central-1.pooler.supabase.com; do
              try="postgresql://postgres.${SUPABASE_PROJECT_REF}:${pw}@${host}:5432/postgres?sslmode=require"
              if psql "$try" -tAc 'select 1' >/dev/null 2>&1; then
                url="$try"; echo "Връзка през $host"; break
              fi
            done
          fi
          if [ -z "$url" ]; then
            echo "::error::Няма връзка с базата през pooler. Проверете SUPABASE_DB_PASSWORD или добавете секрет SUPABASE_DB_URL (Connect → Session pooler)."
            exit 1
          fi
          echo "::add-mask::$url"
          echo "DB_URL=$url" >> "$GITHUB_ENV"

      - name: Прилагане на промените по базата
        run: supabase db push --remote="$DB_URL" --yes

      - name: Качване на сървърните функции (login, notify)
        run: supabase functions deploy --remote="$SUPABASE_PROJECT_REF" --no-verify-jwt --yes

      - name: Проверка на живия сървър (без промени)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: ci/smoke_live.sh

  build:
    needs: server
    runs-on: ubuntu-latest
    env:
      # Firebase се включва само когато тайните са добавени в GitHub Secrets.
      HAS_FIREBASE: ${{ secrets.FIREBASE_APP_ID != '' && secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      # Към тестерите се изпраща само при ръчно пускане (Actions → Run workflow)
      # или когато съобщението на промяната съдържа „[тестери]“.
      SEND_TO_TESTERS: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[тестери]') }}
      APK_NAME: kairos-${{ github.run_number }}.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Създаване на Android частта
        run: |
          flutter --version
          flutter create . --platforms=android --org bg.kairos --project-name kairos
          rm -f test/widget_test.dart   # примерен тест от шаблона, не ни трябва
          # Име на приложението, пакет, известия, настройки за изграждане
          python3 ci/patch_android.py .
          cat android/settings.gradle.kts

      - name: Постоянен тестов ключ (за да се обновява върху старата версия)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: Проверка на кода
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Тестове на логиката
        run: flutter test

      - name: Изграждане
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_ANDROID_API_KEY="$FIREBASE_ANDROID_API_KEY"

      - name: Преименуване
        run: cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"

      - name: Публикуване в GitHub Releases (резервно)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Тестова версия ${{ github.run_number }}
          body: Свалете файла .apk на телефона и го отворете, за да се инсталира.
          prerelease: true
          files: ${{ env.APK_NAME }}

      - name: Изпращане към Firebase App Distribution
        if: env.HAS_FIREBASE == 'true' && env.SEND_TO_TESTERS == 'true'
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          printf 'Версия %s\n\n%s\n' "${{ github.run_number }}" "${COMMIT_MESSAGE:-Ръчно изграждане}" > "$RUNNER_TEMP/notes.txt"
          npx --yes firebase-tools@latest appdistribution:distribute "$APK_NAME" \
            --app "$FIREBASE_APP_ID" \
            --groups "testers" \
            --release-notes-file "$RUNNER_TEMP/notes.txt"
          rm -f "$RUNNER_TEMP/firebase-sa.json"

      - name: Без изпращане към тестерите
        if: env.HAS_FIREBASE == 'true' && env.SEND_TO_TESTERS != 'true'
        run: echo "::notice::Версията е изградена, но не е изпратена към тестерите (няма „[тестери]“ в съобщението)."

      - name: Напомняне за Firebase
        if: env.HAS_FIREBASE != 'true'
        run: echo "::notice::Firebase App Distribution не е настроен (липсват FIREBASE_APP_ID и FIREBASE_SERVICE_ACCOUNT). APK е само в GitHub Releases."
