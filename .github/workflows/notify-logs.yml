name: Дневник на известията

# Ръчно: Actions → „Дневник на известията“ → Run workflow.
# Показва последните извиквания на функцията notify: вид, код и резултат
# (брой получатели/устройства/изпратени или грешка) – без лични данни.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "За колко часа назад"
        default: "6"

jobs:
  logs:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      HOURS: ${{ github.event.inputs.hours }}
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Имена на тайните на функциите (без стойностите)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | sed -E 's/[0-9a-f]{32,}/<digest>/g' || true

      - name: Извличане
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            url="$SUPABASE_DB_URL"
          else
            pw=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
            url=""
            for host in aws-1-eu-central-1.pooler.supabase.com aws-0-eu-central-1.pooler.supabase.com; do
              try="postgresql://postgres.${SUPABASE_PROJECT_REF}:${pw}@${host}:5432/postgres?sslmode=require"
              if psql "$try" -tAc 'select 1' >/dev/null 2>&1; then url="$try"; break; fi
            done
          fi
          [ -n "$url" ] || { echo "::error::Няма връзка с базата"; exit 1; }
          echo "::add-mask::$url"
          h=$(python3 -c 'import os;print(float(os.environ.get("HOURS") or 6))')
          psql "$url" -P pager=off -c "
            select to_char(at at time zone 'Europe/Sofia', 'DD.MM HH24:MI:SS') as час,
                   type as вид, status as код, info as резултат
              from public.notify_log
             where at > now() - interval '$h hours'
             order by at desc limit 200;"
