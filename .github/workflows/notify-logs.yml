name: Дневник на известията

# Ръчно: Actions → „Дневник на известията“ → Run workflow.
# Показва последните извиквания на функцията notify (код на отговора) и
# нейния дневник (вид, брой получатели/устройства/изпратени) – без лични данни.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "За колко часа назад"
        default: "6"

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Извличане
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          HOURS: ${{ github.event.inputs.hours }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, datetime as dt
          ref, token = os.environ["REF"], os.environ["TOKEN"]
          end = dt.datetime.now(dt.timezone.utc)
          start = end - dt.timedelta(hours=float(os.environ.get("HOURS") or 6))
          def q(sql):
              url = (f"https://api.supabase.com/v1/projects/{ref}/analytics/endpoints/logs.all?"
                     + urllib.parse.urlencode({"sql": sql,
                        "iso_timestamp_start": start.isoformat(), "iso_timestamp_end": end.isoformat()}))
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req) as r:
                  return json.load(r).get("result") or []
          def ts(v):
              return dt.datetime.fromtimestamp(int(v) / 1e6, dt.timezone(dt.timedelta(hours=2))).strftime("%d.%m %H:%M:%S")
          print("== Извиквания (час по София, код) ==")
          for r in q("select timestamp, event_message, response.status_code as code from function_edge_logs "
                     "cross join unnest(metadata) as m cross join unnest(m.response) as response "
                     "order by timestamp desc limit 200"):
              msg = r.get("event_message", "")
              if "/notify" in msg or "/login" in msg:
                  name = "notify" if "/notify" in msg else "login"
                  print(ts(r["timestamp"]), name, r.get("code"))
          print("== Дневник на notify ==")
          for r in q("select timestamp, event_message, m.level as level from function_logs "
                     "cross join unnest(metadata) as m order by timestamp desc limit 200"):
              msg = (r.get("event_message") or "").strip()
              if msg.startswith("notify ") or msg.startswith("FCM") or r.get("level") == "error":
                  print(ts(r["timestamp"]), msg[:300])
          PY
